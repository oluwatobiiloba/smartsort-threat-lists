# Builds SmartSort's threat lists once a night and publishes them, signed.
#
# Three things have to be set up once, by the repository's owner:
#   1. Settings > Pages > Source: "GitHub Actions".
#   2. Settings > Environments > "signing": deployment branches limited to
#      `main`, with the secret LISTS_SIGNING_KEY (the Ed25519 private key, PEM).
#   3. Settings > Secrets and variables > Actions: the secret IOC_DEPLOY_KEY, a
#      read-only deploy key for the private repository that holds the curated
#      indicators, and the secret INDICATOR_REPOSITORY, that repository's
#      owner/name. A secret, not a variable: secrets are masked in the public
#      log, and actions/checkout prints the repository it checks out.
name: Publish lists

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  OSV_NPM: https://osv-vulnerabilities.storage.googleapis.com/npm/all.zip
  OSV_PYPI: https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the setup
        # Left empty, the next step would quietly check out this repository instead.
        # The secret is masked as a whole; the name alone is masked here too, for the rest of the job.
        env:
          INDICATOR_REPOSITORY: ${{ secrets.INDICATOR_REPOSITORY }}
        run: |
          test -n "$INDICATOR_REPOSITORY" || { echo "::error::The secret INDICATOR_REPOSITORY is not set"; exit 1; }
          echo "::add-mask::$INDICATOR_REPOSITORY"
          echo "::add-mask::${INDICATOR_REPOSITORY#*/}"

      - name: Fetch the curated indicators (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.INDICATOR_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.IOC_DEPLOY_KEY }}
          path: indicator-source
          sparse-checkout: iocs
          persist-credentials: false

      - name: Fetch the OSV exports
        run: |
          mkdir -p osv/npm osv/pypi
          curl --fail --silent --show-error --location --retry 3 --max-filesize 1500000000 -o osv/npm/all.zip "$OSV_NPM"
          curl --fail --silent --show-error --location --retry 3 --max-filesize 1500000000 -o osv/pypi/all.zip "$OSV_PYPI"

      - name: Fetch the rule package
        # YARA Forge's "core" package. Its release tag is kept for the rule file's header.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p forge
          # The tag first, then that exact release, so a release made in between cannot mix the two.
          gh release view --repo YARAHQ/yara-forge --json tagName --jq .tagName > forge/release.txt
          # The tag is downloaded text that ends up in a command line and a comment: one plain word only.
          tag=$(cat forge/release.txt)
          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::The rule package's release tag is not a plain name"; exit 1; }
          gh release download "$(cat forge/release.txt)" --repo YARAHQ/yara-forge --pattern yara-forge-rules-core.zip --dir forge

      - name: Check and build the rules
        # The wheel is pinned by hash. -I: nothing is read from the folders the downloads are in.
        # --benign: a rule that matches any of the runner's own programs and libraries is left out.
        # They are scanned in this order up to 20,000 files and 2 GB, so the largest folder is last.
        # Rules that match files on a Mac, which this runner cannot see, go in tools/rules-denylist.txt.
        run: |
          python3 -m venv rules-venv
          rules-venv/bin/pip install --require-hashes --only-binary=:all: -r tools/requirements-rules.txt
          site_packages=$(rules-venv/bin/python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          mkdir -p rules
          rules-venv/bin/python -I tools/build_rules.py \
            --forge forge/yara-forge-rules-core.zip \
            --out rules/rules.yar \
            --forge-release "$(cat forge/release.txt)" \
            --check \
            --benign "$site_packages" \
            --benign /usr/bin \
            --benign /usr/sbin \
            --benign /usr/lib/x86_64-linux-gnu

      - name: Build the lists
        # -I: the script is run without reading anything from the folders the downloads are in.
        # The private repository's name, so the build can refuse to publish a file that gives it.
        env:
          INDICATOR_REPOSITORY: ${{ secrets.INDICATOR_REPOSITORY }}
        run: |
          python3 -I tools/build_lists.py \
            --npm osv/npm/all.zip --pypi osv/pypi/all.zip \
            --indicators indicator-source/iocs \
            --expect tools/expected-indicators.txt \
            --rules rules/rules.yar \
            --notice NOTICE.txt \
            --out site/v1

      - name: Refuse to go backwards
        # The app ignores a manifest whose number is not higher than the one it has.
        # Both addresses the app reads from are checked; either may be the one that is up.
        run: |
          new=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["seq"])' site/v1/manifest.json)
          seen=0
          for url in \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/v1/manifest.json" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/lists/manifest.json"; do
            rm -f published.json
            if curl --fail --silent --location --proto '=https' --proto-redir '=https' --max-filesize 65536 \
                 -o published.json "$url"; then
              old=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["seq"])' published.json)
              echo "$url: published $old, new $new"
              [ "$new" -gt "$old" ] || { echo "::error::$url already has $old"; exit 1; }
              seen=1
            else
              echo "$url: nothing readable"
            fi
          done
          [ "$seen" = 1 ] || echo "nothing published yet; new $new"

      - name: Add the page a browser sees
        # The app asks only for the files the manifest names. A person opening the
        # site, or its v1 folder, gets this page instead of GitHub's 404.
        run: |
          cp pages/index.html site/index.html
          cp pages/index.html site/v1/index.html

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned
          path: site
          retention-days: 3

  sign:
    needs: build
    runs-on: ubuntu-latest
    # The key lives in this environment only, and the environment only runs for `main`.
    environment: signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: keys

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned
          path: site

      - name: Sign the manifest
        env:
          LISTS_SIGNING_KEY: ${{ secrets.LISTS_SIGNING_KEY }}
        run: |
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$LISTS_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in site/v1/manifest.json -out manifest.sig.raw
          # Check it against the public key in this repository: a wrong secret stops here.
          openssl pkeyutl -verify -rawin -pubin -inkey keys/primary.pub.pem \
            -in site/v1/manifest.json -sigfile manifest.sig.raw
          base64 -w0 manifest.sig.raw > site/v1/manifest.json.sig
          test "$(wc -c < manifest.sig.raw)" -eq 64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed
          path: site
          retention-days: 3

      # The Pages bundle is made here, one job before it is deployed: deployed
      # in the job that made it, the bundle was not yet listed when the deploy
      # looked for it.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          retention-days: 3

  pages:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    # The same files again as a release, the second address the app tries.
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed
          path: site
      - name: Replace the release's files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view lists >/dev/null 2>&1 || gh release create lists --title "Threat lists" \
            --notes "The current lists, the same files GitHub Pages serves. Replaced every night."
          # The manifest goes last: until it is replaced, the old one still names files that are there.
          # index.html is for Pages only; the release holds the list files.
          find site/v1 -type f ! -name 'manifest.json*' ! -name index.html -print0 | xargs -0 gh release upload lists --clobber
          gh release upload lists --clobber site/v1/manifest.json.sig site/v1/manifest.json
          keep=$(cd site/v1 && ls | grep -vxF index.html)
          gh release view lists --json assets --jq '.assets[].name' | while read -r name; do
            echo "$keep" | grep -qxF "$name" || gh release delete-asset lists "$name" --yes
          done

  keep-schedule:
    # GitHub stops a public repository's nightly schedule after 60 days without
    # a commit, and this repository gets none. Switching the workflow on again
    # starts that count over. It runs on its own, so a night that fails to
    # publish does not let the schedule lapse.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable publish.yml
